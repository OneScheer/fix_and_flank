<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fix and Flank</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='4' width='14' height='8' fill='none' stroke='%234a7fd0' stroke-width='2'/%3E%3Cpath d='M1 4L15 12M15 4L1 12' stroke='%234a7fd0' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #111410; --panel: #181c17; --line: #2c3329; --text: #c8d0c2; --dim: #8a9484;
      --accent: #4a7fd0; --engage: #b8452f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, monospace; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: baseline; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 15px; letter-spacing: 0.08em; }
    #turn { color: var(--dim); }
    main { flex: 1; display: flex; min-height: 0; }
    #board { flex: 1; min-width: 0; display: block; touch-action: none; cursor: crosshair; }
    aside { width: 340px; display: flex; flex-direction: column; gap: 12px; padding: 12px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; }
    h2 { margin: 0 0 6px; font-size: 11px; font-weight: normal; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; }
    button { font: inherit; color: var(--text); background: #232922; border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--dim); }
    button:disabled { opacity: 0.45; cursor: default; }
    button.selected { border-color: var(--accent); background: #22324a; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .row button { flex: 1; }
    #teams { display: flex; flex-direction: column; gap: 6px; }
    .team { text-align: left; border-left-width: 4px; }
    .team.selected { background: #22324a; border-color: var(--accent); }
    .note { color: #e0b060; margin-top: 3px; }
    #engage { background: var(--engage); border-color: #d9674f; color: #fff; font-weight: bold; letter-spacing: 0.1em; padding: 10px; }
    #message { color: #e0b060; min-height: 1.4em; }
    #log { margin: 0; white-space: pre-wrap; color: var(--dim); max-height: 220px; overflow-y: auto; font-size: 12px; }
    .keys { color: var(--dim); font-size: 12px; }
    footer { padding: 6px 16px; border-top: 1px solid var(--line); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 800px) {
      main { flex-direction: column; }
      #board { min-height: 55vh; }
      aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header><h1>FIX AND FLANK</h1><span id="turn"></span></header>
  <main>
    <canvas id="board"></canvas>
    <aside>
      <section>
        <h2>Fireteams</h2>
        <div id="teams"></div>
      </section>
      <section>
        <h2>Movement</h2>
        <div class="row">
          <button id="speed-walk">Walk</button>
          <button id="speed-run">Run</button>
          <button id="speed-crawl">Crawl</button>
        </div>
      </section>
      <section class="row">
        <button id="hold">Hold</button>
        <button id="clear">Clear order</button>
      </section>
      <div id="message"></div>
      <button id="engage">ENGAGE</button>
      <section class="row">
        <button id="replay">Replay last turn</button>
        <button id="pbspeed">Playback 1x</button>
      </section>
      <section>
        <h2>Last turn</h2>
        <pre id="log"></pre>
      </section>
      <section class="keys">
        1-9 select team. W / R / C walk, run, crawl. H hold. Backspace clear.
        Space engage (or skip playback). P replay. F fit map.
      </section>
    </aside>
  </main>
  <footer id="status">Loading...</footer>
  <script type="module" src="src/main.js"></script>
</body>
</html>
