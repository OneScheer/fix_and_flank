<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix and Flank</title>
<style>
  :root {
    --paper: #E8E5DA;
    --card: #F6F4EE;
    --rule: #BDB8A8;
    --ink: #15181A;
    --ink-muted: #4A4D46;
    --suppressed: #F2B33D;
    --pinned: #8E1B12;
    --wounded-bg: #F1DDB4;
    --wounded-ink: #6B3F00;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  .layout { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 16px; align-items: flex-start; }
  .map-wrap { flex: 0 1 auto; max-width: 100%; overflow: auto; border: 2px solid var(--ink); line-height: 0; }
  canvas { display: block; touch-action: none; }
  #roster { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

  .roster-card { background: var(--card); border: 1px solid var(--rule); padding: 16px 20px; }
  .roster-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .roster-title { display: flex; align-items: baseline; gap: 12px; }
  .roster-title h2 { margin: 0; font-size: 26px; letter-spacing: 0.06em; }
  .roster-total { font-family: var(--mono); font-size: 16px; font-weight: 600; }
  .roster-casualties { margin: 4px 0 8px; font-size: 16px; color: var(--ink-muted); }
  .roster-state { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border: 1.5px solid var(--ink); }
  .roster-state.is-suppressed { background: var(--suppressed); }
  .roster-state.is-pinned { background: var(--pinned); border-color: var(--pinned); color: #fff; }
  .roster-list { border-top: 1px solid var(--rule); }
  .roster-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 36px 80px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .roster-row.is-down { opacity: 0.6; }
  .roster-row.is-down .roster-role { text-decoration: line-through; }
  .roster-code { font-family: var(--mono); font-size: 13px; font-weight: 600; border: 1.5px solid var(--ink); text-align: center; padding: 2px 0; }
  .roster-who { display: flex; flex-direction: column; min-width: 0; }
  .roster-role { font-size: 18px; font-weight: 600; line-height: 1.1; }
  .roster-weapon { font-size: 14px; color: var(--ink-muted); }
  .roster-pips { display: flex; gap: 5px; }
  .pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); }
  .pip.is-on { background: var(--ink); }
  .roster-hp { font-family: var(--mono); font-size: 14px; font-weight: 600; text-align: right; }
  .roster-tag { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-align: center; padding: 3px 0; border: 1.5px solid var(--ink); }
  .roster-tag.is-wounded { background: var(--wounded-bg); color: var(--wounded-ink); border-color: var(--wounded-ink); }
  .roster-tag.is-down { background: var(--ink-muted); color: var(--card); border-color: var(--ink-muted); }
</style>
</head>
<body>
<main class="layout">
  <div class="map-wrap"><canvas id="map" aria-label="Tactical map"></canvas></div>
  <aside id="roster" aria-label="Team roster"></aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
